name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of the `--version` flag, or the release tag.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: macOS 27.0, Apple M2 Pro
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Issues are public, so remove names, device IDs and other personal data first.
      render: text
